name: links

# Links in the front-door page and README. Monthly as well, because external targets
# can move without this repository changing.
on:
  push:
    branches: [main]
    paths: ['README.md', 'index.html', '.github/workflows/links.yml']
  schedule:
    - cron: '29 6 4 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 4 --retry-wait-time 10 --timeout 30
            --accept 200,206,429 --exclude-all-private
            --exclude '\$\{'
            README.md index.html
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
